[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-config-comparison-tool"
version = "1.1.0"
description = "Python GUI application that retrieves system configuration and compares two configurations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LPU Student" }]
keywords = ["system", "configuration", "comparison", "gui",
            "psutil", "customtkinter", "academic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications (Tk)",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9",
    "customtkinter>=5.2,<7",
]

[project.scripts]
system-config-comparator = "app.gui:run"

[tool.setuptools.packages.find]
include = ["app*"]
